server:
  forward-headers-strategy: none

spring:
  application:
    name: URL_Shortener

  datasource:
    # 本机示例连接；部署时通过私有配置或 SPRING_DATASOURCE_* 覆盖。
    url: jdbc:mysql://127.0.0.1:3306/shortlink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 1234
      timeout: 500ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated   # 统计消息要确认，否则丢了都不知道
    publisher-returns: true
    connection-timeout: 2000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 500
          max-retries: 3
        default-requeue-rejected: false
        missing-queues-fatal: false
  web:
    error:
      include-exception: false
      include-stacktrace: never

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

shortlink:
  cors:
    # 只放行合法预检；正式请求仍要求凭据。
    allowed-origins: ${SHORTLINK_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  proxy:
    trusted-cidrs: ${SHORTLINK_TRUSTED_PROXIES:}
  fallback:
    # 每实例保护预算，限制 Redis 故障时的数据库压力。
    create-qps: 10
    redirect-qps: 1000
    db-qps: 200
    db-max-concurrent: 8
  stats:
    # 访问趋势使用有界内存队列，满或退出时允许丢失，不用于审计。
    max-pending: 4096
    confirm-timeout-millis: 5000
  admin:
    token: ${SHORTLINK_ADMIN_TOKEN:}
  auth:
    tokens:
      default: ${SHORTLINK_API_TOKEN:}
  domain: localhost:8080

  cache:
    local-max-size: 100000
    # Pub/Sub 漏收时限制其他实例持有旧 L1 的时间。
    local-ttl-seconds: 5

  rate-limit:
    create:        # 严格：写操作，刷量无正当理由
      capacity: 20
      refill-per-sec: 10
    redirect:      # 宽松：正常用户会高频访问同一短链
      capacity: 200
      refill-per-sec: 100

  risk:
    block-private-network: true
    blocked-domains: evil.example,phishing.test
    allowed-domains:

logging:
  level:
    root: INFO
    top.mayiqin.url_shortener: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: url-shortener
