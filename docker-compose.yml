# 一键起全部中间件。
#
# ⚠️ 不要装在宿主机上。环境必须能随时推倒重建，否则压测数据不可复现——
# 而"压测数据可复现"是这个项目简历价值的地基。
#
#   docker compose up -d
#   docker compose down -v     # -v 连数据卷一起删，回到干净状态

services:
  mysql:
    image: mysql:8.0
    container_name: sl-mysql
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shortlink
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 压测相关参数。默认值在容器里往往偏小，会让你误判瓶颈在 DB。
      - --max_connections=1000
      - --innodb_buffer_pool_size=1G
      # innodb_flush_log_at_trx_commit=2 牺牲了"崩溃丢 1 秒事务"换写入吞吐。
      # 生产绝不能这么设，但压测环境为了不让磁盘 fsync 掩盖真实瓶颈可以开。
      # ⚠️ 在简历/面试里提到压测数据时，要主动说明这个设置——否则数字不诚实。
      - --innodb_flush_log_at_trx_commit=2
      - --slow_query_log=1
      - --long_query_time=0.1
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro     # 首次启动自动执行 schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sl-redis
    ports: ["6379:6379"]
    command:
      - redis-server
      - --appendonly
      - "no"                          # 压测环境关 AOF，别让持久化掩盖真实延迟
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      # hll-sparse-max-bytes 默认 3000：低基数 HLL 用 sparse 编码只占几十字节，
      # 超过这个阈值才转 dense（固定 12KB）。Week 3 做 UV 统计时会用到。
      - --hll-sparse-max-bytes
      - "3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"                 # 管理台 http://localhost:15672 admin/admin123
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 监控（Week 5 再启用，先写好省事）
  prometheus:
    image: prom/prometheus:latest
    container_name: sl-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["monitoring"]           # docker compose --profile monitoring up -d

  grafana:
    image: grafana/grafana:latest
    container_name: sl-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    profiles: ["monitoring"]

volumes:
  mysql-data:
