# 一键起全部中间件。
#
# ⚠️ 不要装在宿主机上。环境必须能随时推倒重建，否则压测数据不可复现——
# 而"压测数据可复现"是这个项目简历价值的地基。
#
#   docker compose up -d
#   docker compose down -v     # -v 连数据卷一起删，回到干净状态

services:
  mysql:
    image: mysql:8.0
    container_name: sl-mysql
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shortlink
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 压测相关参数。默认值在容器里往往偏小，会让你误判瓶颈在 DB。
      - --max_connections=1000
      - --innodb_buffer_pool_size=1G
      # 统计批次回执和增量必须持久提交，历史非持久模式压测结果需要重测。
      - --innodb_flush_log_at_trx_commit=1
      - --slow_query_log=1
      - --long_query_time=0.1
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅挂载初始化脚本；维护/迁移脚本不能被 entrypoint 自动执行。
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sl-redis
    ports: ["6379:6379"]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      # HyperLogLog 保持默认稀疏编码阈值，用于访问趋势的 UV/UIP 估计。
      - --hll-sparse-max-bytes
      - "3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"                 # 管理台 http://localhost:15672 admin/admin123
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 可选监控
  prometheus:
    image: prom/prometheus:latest
    container_name: sl-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    profiles: ["monitoring"]           # docker compose --profile monitoring up -d

  grafana:
    image: grafana/grafana:latest
    container_name: sl-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    profiles: ["monitoring"]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
