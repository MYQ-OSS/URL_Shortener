name: URL Shortener CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend unit and MVC tests
        run: mvn clean test -B

      # 集成测试自建独立容器，不再重复启动未被单测使用的 services。
      - name: Isolated backend integration
        timeout-minutes: 15
        env:
          SHORTLINK_INTEGRATION_TESTS: 'true'
          # GitHub Actions 的 docker 环境下 Ryuk 常因 cgroup/权限问题启动失败，
          # runner 是一次性的，job 结束后容器会被回收，禁用 Ryuk 不会导致长期泄漏。
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: mvn -Dtest=FullWorkflowIT -DfailIfNoTests=false test -B

      - name: Frontend unit tests and build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test
          npm --prefix frontend run build:backend

      - name: Package application
        run: mvn package -DskipTests -B

      - name: Build image
        run: docker build -t url-shortener:${{ github.sha }} .
